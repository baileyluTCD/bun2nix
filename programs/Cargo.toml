[workspace]
resolver = "2"
members = ["bun2nix", "bun2nix-core", "cache-entry-creator"]

[workspace.package]
version = "2.1.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
