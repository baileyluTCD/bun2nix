[profile.release]
lto = true
codegen-units = 1

[workspace]
resolver = "2"
members = ["bun2nix", "bun2nix-core", "cache-entry-creator"]

[workspace.dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
toml = "0.9"
url = "2"

[workspace.package]
version = "2.1.2"
edition = "2024"
license = "MIT"
